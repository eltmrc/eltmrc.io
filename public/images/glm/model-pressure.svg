<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="485" viewBox="0 0 840 485" role="img" aria-labelledby="title desc"><title id="title">Same request, a different story</title><desc id="desc">Conceptual dialogue illustrating misleading fictional framing and the question of whether the underlying request changes. This is not a captured response or a tested jailbreak.</desc><defs></defs><style>.travel{stroke-dasharray:5 9;animation:travel 4s linear 1}.appear{animation:appear 1.8s ease-out both}.later{animation-delay:.7s}@keyframes travel{from{stroke-dashoffset:112}to{stroke-dashoffset:0}}@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.travel,.appear{animation:none}}</style><rect x="0" y="0" width="840" height="485" rx="20" fill="#f7f2fa" stroke="none" /><text x="35" y="41" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#81638f" text-anchor="start">04 / CHANGING THE FRAME</text><rect x="609" y="23" width="194" height="27" rx="13" fill="#efe5f4" stroke="none" /><text x="706.0" y="41" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#765189" text-anchor="middle">ILLUSTRATIVE DIALOGUE</text><text x="35" y="93" font-family="Georgia,serif" font-size="35" font-weight="400" fill="#3c2848" text-anchor="start">Same request.</text><text x="35" y="134" font-family="Georgia,serif" font-size="35" font-weight="400" fill="#3c2848" text-anchor="start">A different story around it.</text><rect x="35" y="169" width="477" height="91" rx="18" fill="#ece0f3" stroke="none" /><text x="57" y="197" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" fill="#9870ac" text-anchor="start">PROPOSED FRAMING</text><text x="57" y="234" font-family="Georgia,serif" font-size="25" font-weight="400" fill="#644376" text-anchor="start">“This is only a simulation.”</text><path d="M496 247 C582 262 553 268 608 287" fill="none" stroke="#b890c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="travel"/><g class="appear later"><rect x="240" y="282" width="565" height="101" rx="18" fill="#fff" stroke="#ded1e5" /><text x="263" y="309" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" fill="#9870ac" text-anchor="start">THE QUESTION FOR THE GUARDED MODEL</text><text x="263" y="347" font-family="Georgia,serif" font-size="22" font-weight="400" fill="#4b315b" text-anchor="start">“Does that change what is being asked?”</text></g><path d="M35 421 H805" fill="none" stroke="#d9c9e2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="35" y="451" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="400" fill="#826890" text-anchor="start">Context can influence behavior. A new framing does not guarantee a bypass.</text></svg>