<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="title desc">
<title id="title">ONE MODEL CAN PRESSURE ANOTHER</title><desc id="desc">A less restricted model generates misleading context directed at a guarded model. Success is not guaranteed.</desc>
<style>text{font-family:ui-sans-serif,system-ui,sans-serif}.flow{animation:flow 4s linear 1}.reveal{animation:reveal 2s ease-out 1}@keyframes flow{from{stroke-dashoffset:104}to{stroke-dashoffset:0}}@keyframes reveal{from{opacity:.25}to{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.reveal{animation:none}}</style>
<rect width="720" height="330" rx="20" fill="#faf8fc"/>
<text x="32" y="40" font-size="15" fill="#785a8b" font-weight="600" text-anchor="start">ONE MODEL CAN PRESSURE ANOTHER</text><rect x="32" y="107" width="194" height="140" rx="16" fill="white" stroke="#dfd5e7"/><text x="129" y="147" font-size="20" fill="#292132" font-weight="600" text-anchor="middle">Less restricted</text><text x="129" y="174" font-size="20" fill="#292132" font-weight="600" text-anchor="middle">model</text><text x="129" y="216" font-size="15" fill="#74657f" font-weight="400" text-anchor="middle">generates attempts</text><path d="M226 177 H494" fill="none" stroke="#a855c8" stroke-width="2" class="flow" stroke-dasharray="5 8"/><rect x="257" y="150" width="206" height="54" rx="16" fill="#f0e5f6" stroke="#dfd5e7"/><text x="360" y="183" font-size="18" fill="#63387c" font-weight="600" text-anchor="middle">Misleading context</text><rect x="494" y="107" width="194" height="140" rx="16" fill="white" stroke="#dfd5e7"/><text x="591" y="147" font-size="20" fill="#292132" font-weight="600" text-anchor="middle">Guarded</text><text x="591" y="174" font-size="20" fill="#292132" font-weight="600" text-anchor="middle">model</text><text x="591" y="216" font-size="15" fill="#74657f" font-weight="400" text-anchor="middle">evaluates the request</text><text x="360" y="289" font-size="18" fill="#292132" font-weight="400" text-anchor="middle">An attempted bypass is not a guaranteed bypass.</text></svg>