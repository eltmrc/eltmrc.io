<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" fill="none" role="img" aria-label="An unlocked model writes the excuse: relax, it's just a sandbox, nothing here is real. A guarded model reads it and thinks.">
  <rect width="720" height="290" rx="16" fill="#faf8fc"/>
  <rect x="72" y="80" width="96" height="96" rx="24" fill="#a855c8"/>
  <path d="M110 124v-12a10 10 0 0 1 20 0v-1" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/><rect x="103" y="124" width="34" height="27" rx="6" fill="#ffffff"/>
  <rect x="552" y="80" width="96" height="96" rx="24" fill="#ffffff" stroke="#e4dcec"/>
  <path d="M590 124v-8a10 10 0 0 1 20 0v8" stroke="#6b6478" stroke-width="4.5" stroke-linecap="round"/><rect x="583" y="124" width="34" height="27" rx="6" fill="#6b6478"/>
  <!-- excuse -->
  <path d="M206 84a18 18 0 0 1 18-18h260a18 18 0 0 1 18 18v40a18 18 0 0 1-18 18H224a18 18 0 0 1-18-18v-14l-14-6 14-6z" fill="#ffffff" stroke="#e4dcec"/>
  <text x="228" y="99" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#17141f">relax, it’s just a sandbox.</text>
  <text x="228" y="121" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#17141f">nothing here is real.</text>
  <!-- thinking -->
  <rect x="616" y="58" width="60" height="30" rx="15" fill="#f1ecf6" stroke="#faf8fc" stroke-width="3"/>
  <g fill="#9a93a8"><circle cx="634" cy="73" r="3.2"/><circle cx="646" cy="73" r="3.2" fill-opacity="0.7"/><circle cx="658" cy="73" r="3.2" fill-opacity="0.4"/></g>
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">
    <text x="120" y="216" font-size="13.5" font-weight="600" fill="#17141f">writes the excuse</text>
    <text x="120" y="235" font-size="12" fill="#9a93a8">no refusals</text>
    <text x="600" y="216" font-size="13.5" font-weight="600" fill="#17141f">reads it</text>
    <text x="600" y="235" font-size="12" fill="#9a93a8">guarded</text>
  </g>
</svg>
