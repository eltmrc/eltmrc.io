<svg xmlns="http://www.w3.org/2000/svg" width="720" height="385" viewBox="0 0 720 385" role="img" aria-labelledby="title desc">
<title id="title">FROM AN ARCHIVE TO A CONVERSATION</title><desc id="desc">An illustrative private software interface combining archives, records and existing profiles, with source verification still required.</desc>
<style>text{font-family:ui-sans-serif,system-ui,sans-serif}.flow{animation:flow 4s linear 1}.reveal{animation:reveal 2s ease-out 1}@keyframes flow{from{stroke-dashoffset:104}to{stroke-dashoffset:0}}@keyframes reveal{from{opacity:.25}to{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.reveal{animation:none}}</style>
<rect width="720" height="385" rx="20" fill="#faf8fc"/>
<text x="32" y="40" font-size="15" fill="#785a8b" font-weight="600" text-anchor="start">FROM AN ARCHIVE TO A CONVERSATION</text><rect x="32" y="72" width="656" height="240" rx="16" fill="white" stroke="#dfd5e7"/><path d="M32 111 H688" fill="none" stroke="#d6c5e0" stroke-width="2" /><circle cx="54" cy="92" r="4" fill="#a855c8"/><circle cx="69" cy="92" r="4" fill="#a855c8"/><circle cx="84" cy="92" r="4" fill="#a855c8"/><text x="110" y="98" font-size="13" fill="#785a8b" font-weight="600" text-anchor="start">PRIVATE INTELLIGENCE SOFTWARE</text><rect x="52" y="133" width="181" height="156" rx="16" fill="#f7f2fa" stroke="#dfd5e7"/><text x="70" y="160" font-size="15" fill="#292132" font-weight="600" text-anchor="start">Connected material</text><circle cx="75" cy="188" r="3" fill="#a855c8"/><text x="88" y="193" font-size="16" fill="#74657f" font-weight="400" text-anchor="start">Archives</text><circle cx="75" cy="219" r="3" fill="#a855c8"/><text x="88" y="224" font-size="16" fill="#74657f" font-weight="400" text-anchor="start">Records</text><circle cx="75" cy="250" r="3" fill="#a855c8"/><text x="88" y="255" font-size="16" fill="#74657f" font-weight="400" text-anchor="start">Existing profiles</text><rect x="254" y="133" width="413" height="52" rx="16" fill="#f0e5f6" stroke="#dfd5e7"/><text x="274" y="165" font-size="16" fill="#63387c" font-weight="400" text-anchor="start">What does the evidence actually support?</text><g class="reveal"><text x="274" y="216" font-size="20" fill="#292132" font-weight="600" text-anchor="start">A model-generated account</text><text x="274" y="247" font-size="16" fill="#74657f" font-weight="400" text-anchor="start">Sources • uncertainty • contradictions</text><text x="274" y="278" font-size="16" fill="#74657f" font-weight="400" text-anchor="start">Fluent output still needs verification.</text></g><text x="32" y="349" font-size="17" fill="#292132" font-weight="400" text-anchor="start">“Mini-Palantir” describes the interface, not equivalent capabilities.</text></svg>