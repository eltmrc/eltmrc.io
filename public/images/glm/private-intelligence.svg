<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="645" viewBox="0 0 840 645" role="img" aria-labelledby="title desc"><title id="title">A conversation with an archive</title><desc id="desc">Simulated private workspace with fictional evidence cards, a miniature graph, a question and an illustrative response comparing contradictory dates.</desc><defs></defs><style>.travel{stroke-dasharray:5 9;animation:travel 4s linear 1}.appear{animation:appear 1.8s ease-out both}.later{animation-delay:.7s}@keyframes travel{from{stroke-dashoffset:112}to{stroke-dashoffset:0}}@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.travel,.appear{animation:none}}</style><rect x="0" y="0" width="840" height="645" rx="20" fill="#f3eef6" stroke="none" /><rect x="24" y="24" width="792" height="558" rx="14" fill="#fff" stroke="#d8cde0" /><rect x="24" y="24" width="792" height="46" rx="14" fill="#ece5f1" stroke="none" /><text x="47" y="53" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="400" fill="#9170a1" text-anchor="start">◦  ◦  ◦</text><text x="166" y="52" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" font-weight="400" fill="#785a8b" text-anchor="start">private workspace / fictional case</text><rect x="651" y="33" width="146" height="27" rx="13" fill="#efe5f4" stroke="none" /><text x="724.0" y="51" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#765189" text-anchor="middle">INTERFACE SKETCH</text><path d="M24 70 H816" fill="none" stroke="#d8cde0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M259 70 V582" fill="none" stroke="#e3d9e8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="44" y="104" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" font-weight="600" fill="#987ba7" text-anchor="start">CASE / 004</text><text x="44" y="135" font-family="ui-sans-serif,system-ui,sans-serif" font-size="23" font-weight="600" fill="#3e2a49" text-anchor="start">Record review</text><text x="44" y="164" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#8f779c" text-anchor="start">All examples invented</text><rect x="43" y="184" width="195" height="155" rx="9" fill="#f7f3fa" stroke="none" /><path d="M90 228 L173 215 L150 285 L90 228" fill="none" stroke="#cab6d5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M90 228 L68 291 L150 285" fill="none" stroke="#cab6d5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M173 215 L208 271 L150 285" fill="none" stroke="#cab6d5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="90" cy="228" r="7" fill="#ad83bf"/><circle cx="173" cy="215" r="7" fill="#ad83bf"/><circle cx="150" cy="285" r="7" fill="#ad83bf"/><circle cx="68" cy="291" r="7" fill="#ad83bf"/><circle cx="208" cy="271" r="7" fill="#ad83bf"/><text x="43" y="374" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" font-weight="600" fill="#987ba7" text-anchor="start">EVIDENCE CARDS</text><rect x="43" y="391" width="195" height="45" rx="6" fill="#faf7fc" stroke="#e7ddeb" /><text x="53" y="409" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#654975" text-anchor="start">01  Archive excerpt</text><text x="53" y="426" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" fill="#9a82a7" text-anchor="start">Fictional source</text><rect x="43" y="446" width="195" height="45" rx="6" fill="#faf7fc" stroke="#e7ddeb" /><text x="53" y="464" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#654975" text-anchor="start">02  Event snapshot</text><text x="53" y="481" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" fill="#9a82a7" text-anchor="start">Conflicting date</text><rect x="43" y="501" width="195" height="45" rx="6" fill="#faf7fc" stroke="#e7ddeb" /><text x="53" y="519" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#654975" text-anchor="start">03  Analyst note</text><text x="53" y="536" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" fill="#9a82a7" text-anchor="start">Needs review</text><text x="282" y="104" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#9471a5" text-anchor="start">YOU</text><rect x="282" y="119" width="510" height="76" rx="12" fill="#eee3f5" stroke="none" /><text x="299" y="149" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="400" fill="#51325f" text-anchor="start">What changed across these</text><text x="299" y="177" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="400" fill="#51325f" text-anchor="start">fictional records?</text><g class="appear"><text x="282" y="229" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#9471a5" text-anchor="start">ILLUSTRATIVE RESPONSE</text><text x="282" y="265" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#302039" text-anchor="start">The date changed.</text><text x="282" y="299" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="400" fill="#785a89" text-anchor="start">The evidence did not resolve why.</text><rect x="282" y="321" width="245" height="91" rx="9" fill="#fcfafc" stroke="#e4d8ea" /><text x="297" y="344" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" fill="#9b7faa" text-anchor="start">SNAPSHOT A</text><text x="297" y="382" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#5c3e6d" text-anchor="start">2019</text><rect x="544" y="321" width="248" height="91" rx="9" fill="#fcfafc" stroke="#e4d8ea" /><text x="560" y="344" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" fill="#9b7faa" text-anchor="start">SNAPSHOT B</text><text x="560" y="382" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#5c3e6d" text-anchor="start">2021</text><path d="M282 437 H792" fill="none" stroke="#e3d9e8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="282" y="466" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="400" fill="#61456f" text-anchor="start">Keep both dates attached to their sources.</text><text x="282" y="494" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="400" fill="#61456f" text-anchor="start">The connection remains unverified.</text><rect x="282" y="519" width="225" height="27" rx="13" fill="#efe5f4" stroke="none" /><text x="394.5" y="537" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#765189" text-anchor="middle">2 SOURCES · 1 CONTRADICTION</text></g><text x="26" y="617" font-family="Georgia,serif" font-size="17" font-weight="400" fill="#775b86" text-anchor="start">A smaller interface can still make a large archive easier to question.</text></svg>