<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" fill="none" role="img" aria-label="The gap between the frontier and the uncensored copies, 2024 vs now">
  <rect width="720" height="300" rx="16" fill="#faf8fc"/>
  <rect x="40" y="40" width="300" height="220" rx="18" fill="#fff" stroke="rgba(80,50,100,0.14)" stroke-width="1.2"/>
  <text x="66" y="70" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#9a93a8">2024</text>
  <rect x="80" y="90" width="60" height="130" rx="8" fill="#a855c8"/>
  <rect x="170" y="175" width="60" height="45" rx="8" fill="#c9a8de"/>
