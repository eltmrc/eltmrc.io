  <path d="M238 104l6 -8l6 8" fill="none" stroke="#c97070" stroke-width="2"/>
  <path d="M238 160l6 8l6 -8" fill="none" stroke="#c97070" stroke-width="2"/>
  <text x="266" y="135" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#c97070">the gap</text>
  <rect x="380" y="40" width="300" height="220" rx="18" fill="#fff" stroke="rgba(80,50,100,0.14)" stroke-width="1.2"/>
  <text x="406" y="70" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#9a93a8">2026</text>
  <rect x="450" y="90" width="60" height="130" rx="8" fill="#a855c8"/>
  <rect x="540" y="90" width="60" height="130" rx="8" fill="#c9a8de"/>
