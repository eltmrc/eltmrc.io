  <text x="570" y="248" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" fill="#9a93a8">uncensored copy</text>
  <rect x="552" y="52" width="112" height="24" rx="12" fill="#8fd4a8" fill-opacity="0.25"/>
