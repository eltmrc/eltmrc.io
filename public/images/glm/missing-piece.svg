<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" fill="none" role="img" aria-label="Four pieces. The leaks, the collectors and the buyers were already there. The model is the missing piece, dropping into place.">
  <rect width="720" height="320" rx="16" fill="#faf8fc"/>
  <g stroke="#e4dcec" fill="#ffffff">
    <rect x="76" y="120" width="130" height="110" rx="14"/>
    <rect x="222" y="120" width="130" height="110" rx="14"/>
    <rect x="368" y="120" width="130" height="110" rx="14"/>
  </g>
  <rect x="514" y="120" width="130" height="110" rx="14" stroke="#c9a8de" stroke-width="1.5" stroke-dasharray="6 6"/>
  <!-- leaks: stacked sheets -->
  <g stroke="#9a93a8" stroke-width="1.6" stroke-linejoin="round">
    <rect x="131" y="148" width="34" height="44" rx="4" fill="#f1ecf6"/>
    <rect x="123" y="155" width="34" height="44" rx="4" fill="#f1ecf6"/>
    <rect x="115" y="162" width="34" height="44" rx="4" fill="#ffffff"/>
  </g>
  <g stroke="#c9a8de" stroke-width="2" stroke-linecap="round"><path d="M122 174h20M122 182h20M122 190h13"/></g>
  <!-- collectors: folder -->
  <path d="M258 158a4 4 0 0 1 4-4h16l6 7h28a4 4 0 0 1 4 4v32a4 4 0 0 1-4 4h-50a4 4 0 0 1-4-4z" fill="#f1ecf6" stroke="#9a93a8" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- buyers: price tag -->
  <g transform="rotate(-18 433 176)">
    <path d="M412 160h30l14 16-14 16h-30a4 4 0 0 1-4-4v-24a4 4 0 0 1 4-4z" fill="#f1ecf6" stroke="#9a93a8" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="444" cy="176" r="3" fill="#faf8fc" stroke="#9a93a8" stroke-width="1.4"/>
    <text x="424" y="181" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#6b6478">$</text>
  </g>
  <!-- the model -->
  <g transform="rotate(-7 594 104)">
    <rect x="529" y="49" width="130" height="110" rx="14" fill="#a855c8"/>
    <text x="594" y="102" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#ffffff">GLM 5.3</text>
    <text x="594" y="122" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.8">abliterated</text>
  </g>
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">
    <text x="141" y="262" font-size="13.5" font-weight="600" fill="#17141f">the leaks</text>
    <text x="287" y="262" font-size="13.5" font-weight="600" fill="#17141f">the collectors</text>
    <text x="433" y="262" font-size="13.5" font-weight="600" fill="#17141f">the buyers</text>
    <text x="579" y="262" font-size="13.5" font-weight="600" fill="#a855c8">the model</text>
    <text x="141" y="282" font-size="12" fill="#9a93a8">already there</text>
    <text x="287" y="282" font-size="12" fill="#9a93a8">already there</text>
    <text x="433" y="282" font-size="12" fill="#9a93a8">already there</text>
    <text x="579" y="282" font-size="12" fill="#9a93a8">just landed</text>
  </g>
</svg>
