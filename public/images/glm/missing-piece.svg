<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
<title id="title">THE MISSING PIECE</title><desc id="desc">Conceptual diagram of records and archives becoming a readable dossier through a model.</desc>
