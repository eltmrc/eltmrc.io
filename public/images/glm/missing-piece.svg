<text x="32" y="40" font-size="15" fill="#785a8b" font-weight="600" text-anchor="start">THE MISSING PIECE</text><rect x="32" y="93" width="230" height="48" rx="16" fill="white" stroke="#dfd5e7"/><text x="48" y="123" font-size="13" fill="#74657f" font-weight="600" text-anchor="start">SCATTERED RECORDS</text><path d="M262 117 C305 117 295 185 330 185" fill="none" stroke="#a855c8" stroke-width="2" class="flow" stroke-dasharray="5 8"/><rect x="32" y="161" width="230" height="48" rx="16" fill="white" stroke="#dfd5e7"/><text x="48" y="191" font-size="13" fill="#74657f" font-weight="600" text-anchor="start">PRIVATE ARCHIVES</text><path d="M262 185 C305 185 295 185 330 185" fill="none" stroke="#a855c8" stroke-width="2" class="flow" stroke-dasharray="5 8"/><rect x="32" y="229" width="230" height="48" rx="16" fill="white" stroke="#dfd5e7"/><text x="48" y="259" font-size="13" fill="#74657f" font-weight="600" text-anchor="start">AGGREGATED PROFILES</text><path d="M262 253 C305 253 295 185 330 185" fill="none" stroke="#a855c8" stroke-width="2" class="flow" stroke-dasharray="5 8"/><rect x="330" y="130" width="138" height="110" rx="16" fill="#f0e5f6" stroke="#dfd5e7"/><text x="399" y="178" font-size="23" fill="#51335f" font-weight="700" text-anchor="middle">GLM 5.3</text><text x="399" y="204" font-size="14" fill="#785a8b" font-weight="400" text-anchor="middle">interpretation</text><path d="M468 185 H510" fill="none" stroke="#a855c8" stroke-width="2" class="flow" stroke-dasharray="5 8"/><rect x="510" y="100" width="178" height="170" rx="16" fill="white" stroke="#dfd5e7"/><text x="532" y="135" font-size="21" fill="#292132" font-weight="600" text-anchor="start">A readable</text><text x="532" y="161" font-size="21" fill="#292132" font-weight="600" text-anchor="start">dossier</text><rect x="532" y="186" width="126" height="5" rx="2.5" fill="#e4d8ea"/><rect x="532" y="205" width="97" height="5" rx="2.5" fill="#e4d8ea"/><rect x="532" y="224" width="113" height="5" rx="2.5" fill="#e4d8ea"/><text x="32" y="327" font-size="17" fill="#292132" font-weight="400" text-anchor="start">The risk: less work between exposed data and a story about someone.</text></svg>