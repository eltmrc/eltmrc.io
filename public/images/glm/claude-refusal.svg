  <path d="M315 515a7 7 0 1 0 2 8 M315 508v7h-7" fill="none" stroke="#9e9687" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M338 516h4l3-8 3 1v7h6l-2 10h-10v-10 M338 516v10h4" fill="none" stroke="#9e9687" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
