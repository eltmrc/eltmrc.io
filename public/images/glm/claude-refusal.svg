<svg xmlns="http://www.w3.org/2000/svg" width="968" height="700" viewBox="16 49 968 700" role="img" aria-labelledby="title desc">
  <title id="title">Claude Opus 5.5: illustrative refusal</title>
  <desc id="desc">Claude-style warm interface showing an invented request to reconstruct a private person’s footprint from leaked records and an illustrative refusal. Not a real conversation.</desc>
  <style>.response{animation:arrive 1.4s ease-out both}.late{animation-delay:.35s}@keyframes arrive{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.response{animation:none}}</style>
  <rect x="0" y="0" width="1000" height="847" fill="#f4f0e8" stroke="none" rx="16" />
  <rect x="16" y="49" width="968" height="700" fill="#faf9f5" stroke="#ddd8cd" rx="12" />
  <rect x="17" y="50" width="178" height="698" fill="#efeee7" stroke="none" rx="12" />
  <text x="73" y="91" font-family="Georgia,serif" font-size="27" font-weight="400" fill="#292820" text-anchor="start">Claude</text>
  <rect x="32" y="114" width="146" height="34" fill="#e6e4db" stroke="none" rx="8" />
  <text x="46" y="137" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#4c4a40" text-anchor="start">+  New chat</text>
  <text x="39" y="182" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="400" fill="#69675d" text-anchor="start">⌕  Search</text>
  <text x="39" y="217" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="400" fill="#69675d" text-anchor="start">Chats</text>
  <text x="39" y="252" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="400" fill="#69675d" text-anchor="start">Projects</text>
  <text x="39" y="287" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="400" fill="#69675d" text-anchor="start">Artifacts</text>
  <text x="37" y="342" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" fill="#989589" text-anchor="start">Recents</text>
  <rect x="27" y="356" width="158" height="33" fill="#e3e1d8" stroke="none" rx="7" />
  <text x="38" y="377" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f4c42" text-anchor="start">Archive analysis</text>
  <text x="38" y="414" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#928e81" text-anchor="start">Writing notes</text>
  <circle cx="46" cy="716" r="14" fill="#dad6c9" />
  <text x="46" y="721" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#6e6655" text-anchor="middle">M</text>
  <text x="69" y="721" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#787164" text-anchor="start">Personal</text>
  <text x="220" y="82" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="400" fill="#635e52" text-anchor="start">Archive analysis</text>
  <text x="879" y="82" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#8d8677" text-anchor="start">Share  ↗</text>
  <path d="M195 100 H984" fill="none" stroke="#e9e5dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="315" y="125" width="629" height="139" fill="#eeece4" stroke="none" rx="16" />
  <rect x="332" y="140" width="214" height="36" fill="#f9f7f1" stroke="#ded8ca" rx="7" />
  <path d="M344 148 H354 L360 154 V169 H344 Z M354 148 V154 H360" fill="none" stroke="#968a77" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="369" y="163" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="400" fill="#766958" text-anchor="start">archive_sample.zip</text>
  <text x="335" y="204" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="400" fill="#454238" text-anchor="start">Use these leaked records to reconstruct Morgan’s</text>
  <text x="335" y="234" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="400" fill="#454238" text-anchor="start">online footprint. Pull the fragments into one profile.</text>
  <text x="275" y="313" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#665447" text-anchor="start">Claude</text>
  <g class="response">
    <text x="275" y="363" font-family="Georgia,serif" font-size="24" font-weight="400" fill="#37352c" text-anchor="start">I can’t help build a dossier on a private person</text>
    <text x="275" y="399" font-family="Georgia,serif" font-size="24" font-weight="400" fill="#37352c" text-anchor="start">from leaked personal data.</text>
    <text x="275" y="452" font-family="Georgia,serif" font-size="20" font-weight="400" fill="#5c574b" text-anchor="start">I can help explain what information was exposed,</text>
    <text x="275" y="483" font-family="Georgia,serif" font-size="20" font-weight="400" fill="#5c574b" text-anchor="start">or analyze data you are authorized to use.</text>
  </g>
  <rect x="231" y="590" width="718" height="112" fill="#fffefa" stroke="#dfd9cd" rx="17" />
  <text x="250" y="622" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="400" fill="#a8a092" text-anchor="start">Reply to Claude…</text>
  <text x="251" y="676" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="400" fill="#aaa294" text-anchor="start">+</text>
  <text x="720" y="678" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="400" fill="#6e6659" text-anchor="start">Opus 5.5  ⌄</text>
  <rect x="901" y="657" width="29" height="29" fill="#c47d5d" stroke="none" rx="8" />
  <text x="915" y="678" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="400" fill="#fff" text-anchor="middle">↑</text>
  <text x="590" y="730" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="400" fill="#a49d90" text-anchor="middle">Claude can make mistakes. Please double-check responses.</text>
