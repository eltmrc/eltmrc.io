<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="541" viewBox="0 0 840 541" role="img" aria-labelledby="title desc"><title id="title">From a messy archive to a readable answer</title><desc id="desc">Dark simulated console with invented files, a prompt asking for a summary and conflicting dates, and an illustrative response preserving uncertainty.</desc><defs></defs><style>.travel{stroke-dasharray:5 9;animation:travel 4s linear 1}.appear{animation:appear 1.8s ease-out both}.later{animation-delay:.7s}@keyframes travel{from{stroke-dashoffset:112}to{stroke-dashoffset:0}}@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.travel,.appear{animation:none}}</style><rect x="0" y="0" width="840" height="541" rx="20" fill="#211929" stroke="none" /><circle cx="31" cy="29" r="4" fill="#ad8ac1"/><circle cx="47" cy="29" r="4" fill="#786581"/><circle cx="63" cy="29" r="4" fill="#56475f"/><text x="89" y="35" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="400" fill="#b6a5c2" text-anchor="start">local / analysis</text><rect x="606" y="16" width="208" height="27" rx="13" fill="#33283e" stroke="none" /><text x="710.0" y="34" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#cab3da" text-anchor="middle">SIMULATED · SYNTHETIC DATA</text><path d="M0 52 H840" fill="none" stroke="#3f324a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="31" y="91" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" font-weight="600" fill="#a08daf" text-anchor="start">INPUT FILES</text><rect x="31" y="108" width="248" height="74" rx="8" fill="#2b2135" stroke="#463551" /><text x="47" y="136" font-family="ui-monospace,SFMono-Regular,monospace" font-size="16" font-weight="400" fill="#ece3f4" text-anchor="start">archive-a.csv</text><text x="47" y="162" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="400" fill="#aa96ba" text-anchor="start">12 fictional rows</text><rect x="294" y="108" width="248" height="74" rx="8" fill="#2b2135" stroke="#463551" /><text x="310" y="136" font-family="ui-monospace,SFMono-Regular,monospace" font-size="16" font-weight="400" fill="#ece3f4" text-anchor="start">notes-b.txt</text><text x="310" y="162" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="400" fill="#aa96ba" text-anchor="start">3 invented notes</text><rect x="557" y="108" width="248" height="74" rx="8" fill="#2b2135" stroke="#463551" /><text x="573" y="136" font-family="ui-monospace,SFMono-Regular,monospace" font-size="16" font-weight="400" fill="#ece3f4" text-anchor="start">snapshot-c.json</text><text x="573" y="162" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="400" fill="#aa96ba" text-anchor="start">2 sample dates</text><text x="31" y="218" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" font-weight="600" fill="#b79ac9" text-anchor="start">YOU</text><text x="31" y="249" font-family="ui-sans-serif,system-ui,sans-serif" font-size="23" font-weight="400" fill="#f4edf9" text-anchor="start">Summarize these fictional records.</text><text x="31" y="280" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="400" fill="#f4edf9" text-anchor="start">Flag conflicting dates. Don’t fill in the gaps.</text><g class="appear later"><rect x="31" y="310" width="778" height="160" rx="10" fill="#f4eef8" stroke="none" /><text x="52" y="342" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" font-weight="600" fill="#896798" text-anchor="start">ILLUSTRATIVE RESPONSE</text><text x="52" y="377" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="400" fill="#34203f" text-anchor="start">Two records describe a similar event.</text><text x="52" y="409" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="400" fill="#34203f" text-anchor="start">The dates disagree: 2019 and 2021.</text><text x="52" y="444" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="400" fill="#7a598b" text-anchor="start">Conclusion: preserve both claims until verified.</text></g><text x="31" y="509" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" font-weight="400" fill="#ac97bb" text-anchor="start">An interface sketch, not a captured GLM response.</text></svg>