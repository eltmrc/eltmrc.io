<svg xmlns="http://www.w3.org/2000/svg" width="720" height="375" viewBox="0 0 720 375" role="img" aria-labelledby="title desc">
<title id="title">THE VALUE IS IN THE CONNECTIONS</title><desc id="desc">Abstract fragments connect around a fictional silhouette. Connections represent claims, not verified identity.</desc>
<style>text{font-family:ui-sans-serif,system-ui,sans-serif}.flow{animation:flow 4s linear 1}.reveal{animation:reveal 2s ease-out 1}@keyframes flow{from{stroke-dashoffset:104}to{stroke-dashoffset:0}}@keyframes reveal{from{opacity:.25}to{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.reveal{animation:none}}</style>
<rect width="720" height="375" rx="20" fill="#faf8fc"/>
<text x="32" y="40" font-size="15" fill="#785a8b" font-weight="600" text-anchor="start">THE VALUE IS IN THE CONNECTIONS</text><path d="M127 115 L360 196" fill="none" stroke="#a855c8" stroke-width="2" class="flow" stroke-dasharray="5 8"/><rect x="32" y="90" width="190" height="50" rx="16" fill="white" stroke="#dfd5e7"/><text x="127" y="121" font-size="17" fill="#292132" font-weight="400" text-anchor="middle">An old account</text><path d="M127 256 L360 196" fill="none" stroke="#a855c8" stroke-width="2" class="flow" stroke-dasharray="5 8"/><rect x="32" y="231" width="190" height="50" rx="16" fill="white" stroke="#dfd5e7"/><text x="127" y="262" font-size="17" fill="#292132" font-weight="400" text-anchor="middle">A contact record</text><path d="M593 115 L360 196" fill="none" stroke="#a855c8" stroke-width="2" class="flow" stroke-dasharray="5 8"/><rect x="498" y="90" width="190" height="50" rx="16" fill="white" stroke="#dfd5e7"/><text x="593" y="121" font-size="17" fill="#292132" font-weight="400" text-anchor="middle">An affiliation</text><path d="M593 256 L360 196" fill="none" stroke="#a855c8" stroke-width="2" class="flow" stroke-dasharray="5 8"/><rect x="498" y="231" width="190" height="50" rx="16" fill="white" stroke="#dfd5e7"/><text x="593" y="262" font-size="17" fill="#292132" font-weight="400" text-anchor="middle">A past address</text><rect x="270" y="107" width="180" height="186" rx="16" fill="white" stroke="#dfd5e7"/><circle cx="360" cy="158" r="22" fill="#d6b7e4"/><path d="M320 217 Q320 183 360 183 Q400 183 400 217" fill="#d6b7e4"/><text x="360" y="253" font-size="14" fill="#63387c" font-weight="600" text-anchor="middle">ONE PROFILE</text><text x="360" y="275" font-size="14" fill="#74657f" font-weight="400" text-anchor="middle">many claims</text><text x="32" y="339" font-size="17" fill="#292132" font-weight="400" text-anchor="start">A shared identifier can suggest a link. It does not prove an identity.</text></svg>