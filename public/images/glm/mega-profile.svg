<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" fill="none" role="img" aria-label="Five fragments from five different leaks, harmless alone. Joined together, they become one profile of a person. Morgan is fictional.">
  <rect width="720" height="340" rx="16" fill="#faf8fc"/>
  <!-- fragments -->
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#6b6478">
    <g transform="rotate(-4 125 79)"><rect x="50" y="65" width="150" height="28" rx="8" fill="#ffffff" stroke="#e4dcec"/><text x="62" y="83" font-family="ui-monospace,monospace" font-size="11.5">morgan@example.test</text></g>
    <g transform="rotate(5 228 134)"><rect x="186" y="120" width="84" height="28" rx="8" fill="#ffffff" stroke="#e4dcec"/><text x="198" y="138" font-family="ui-monospace,monospace" font-size="11.5">morgan_v</text></g>
    <g transform="rotate(-2 120 174)"><rect x="56" y="160" width="128" height="28" rx="8" fill="#ffffff" stroke="#e4dcec"/><text x="68" y="178" font-family="ui-monospace,monospace" font-size="11.5">+33 6 •• •• 12</text></g>
    <g transform="rotate(6 240 214)"><rect x="200" y="200" width="80" height="28" rx="8" fill="#ffffff" stroke="#e4dcec"/><path d="M216 208a5 5 0 0 1 5 5c0 4-5 9-5 9s-5-5-5-9a5 5 0 0 1 5-5z" fill="none" stroke="#a855c8" stroke-width="1.4"/><text x="228" y="218">Lyon</text></g>
    <g transform="rotate(-5 132 256)"><rect x="70" y="242" width="124" height="28" rx="8" fill="#ffffff" stroke="#e4dcec"/><text x="82" y="260">Acme Corp, 2019</text></g>
  </g>
  <!-- join -->
  <path d="M312 170h52" stroke="#c9a8de" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M358 164l7 6-7 6" stroke="#c9a8de" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- profile -->
  <rect x="394" y="42" width="286" height="230" rx="16" fill="#ffffff" stroke="#e4dcec"/>
  <circle cx="446" cy="94" r="26" fill="#f1e4f8"/>
  <circle cx="446" cy="87" r="9" fill="#c9a8de"/>
  <path d="M430 110a16 13 0 0 1 32 0" fill="#c9a8de"/>
  <text x="486" y="91" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700" fill="#17141f">Morgan V.</text>
  <text x="486" y="110" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#9a93a8">5 leaks, 1 person</text>
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">
    <g fill="#9a93a8"><text x="420" y="156">email</text><text x="420" y="180">alias</text><text x="420" y="204">phone</text><text x="420" y="228">city</text><text x="420" y="252">work</text></g>
    <g fill="#17141f"><text x="486" y="156">morgan@example.test</text><text x="486" y="180">morgan_v</text><text x="486" y="204">+33 6 •• •• 12</text><text x="486" y="228">Lyon</text><text x="486" y="252">Acme Corp</text></g>
  </g>
  <path d="M420 140H654M420 164H654M420 188H654M420 212H654M420 236H654" stroke="#f1ecf6"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">
    <text x="166" y="306" font-size="13.5" font-weight="600" fill="#17141f">five leaks</text>
    <text x="166" y="324" font-size="12" fill="#9a93a8">harmless alone</text>
    <text x="537" y="306" font-size="13.5" font-weight="600" fill="#a855c8">one person</text>
  </g>
</svg>
