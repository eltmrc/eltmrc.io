<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
<title id="title">A BREACH HAS AN AFTERLIFE</title><desc id="desc">Four stages: exposure, circulation, aggregation and redistribution. This cycle is illustrative, not universal.</desc>
<style>text{font-family:ui-sans-serif,system-ui,sans-serif}.flow{animation:flow 4s linear 1}.reveal{animation:reveal 2s ease-out 1}@keyframes flow{from{stroke-dashoffset:104}to{stroke-dashoffset:0}}@keyframes reveal{from{opacity:.25}to{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.reveal{animation:none}}</style>
<rect width="720" height="390" rx="20" fill="#faf8fc"/>
<text x="32" y="40" font-size="15" fill="#785a8b" font-weight="600" text-anchor="start">A BREACH HAS AN AFTERLIFE</text><rect x="32" y="82" width="302" height="100" rx="16" fill="white" stroke="#dfd5e7"/><text x="50" y="111" font-size="14" fill="#a855c8" font-weight="600" text-anchor="start">01</text><text x="89" y="114" font-size="21" fill="#292132" font-weight="600" text-anchor="start">Exposure</text><text x="50" y="154" font-size="16" fill="#74657f" font-weight="400" text-anchor="start">A system loses data</text><rect x="386" y="82" width="302" height="100" rx="16" fill="white" stroke="#dfd5e7"/><text x="404" y="111" font-size="14" fill="#a855c8" font-weight="600" text-anchor="start">02</text><text x="443" y="114" font-size="21" fill="#292132" font-weight="600" text-anchor="start">Circulation</text><text x="404" y="154" font-size="16" fill="#74657f" font-weight="400" text-anchor="start">Sold, traded, copied</text><rect x="386" y="219" width="302" height="100" rx="16" fill="white" stroke="#dfd5e7"/><text x="404" y="248" font-size="14" fill="#a855c8" font-weight="600" text-anchor="start">03</text><text x="443" y="251" font-size="21" fill="#292132" font-weight="600" text-anchor="start">Aggregation</text><text x="404" y="291" font-size="16" fill="#74657f" font-weight="400" text-anchor="start">Old and new combined</text><rect x="32" y="219" width="302" height="100" rx="16" fill="white" stroke="#dfd5e7"/><text x="50" y="248" font-size="14" fill="#a855c8" font-weight="600" text-anchor="start">04</text><text x="89" y="251" font-size="21" fill="#292132" font-weight="600" text-anchor="start">Redistribution</text><text x="50" y="291" font-size="16" fill="#74657f" font-weight="400" text-anchor="start">More copies escape</text><path d="M334 132 H386" fill="none" stroke="#a855c8" stroke-width="2" class="flow" stroke-dasharray="5 8"/><path d="M537 182 V219" fill="none" stroke="#a855c8" stroke-width="2" class="flow" stroke-dasharray="5 8"/><path d="M386 269 H334" fill="none" stroke="#a855c8" stroke-width="2" class="flow" stroke-dasharray="5 8"/><path d="M183 219 V182" fill="none" stroke="#a855c8" stroke-width="2" class="flow" stroke-dasharray="5 8"/><text x="32" y="358" font-size="16" fill="#292132" font-weight="400" text-anchor="start">One possible path. Collections can be copied and recirculated for years.</text></svg>