<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="485" viewBox="0 0 840 485" role="img" aria-labelledby="title desc"><title id="title">The files keep travelling</title><desc id="desc">Paper exports, a folder, bundled archives and copied documents illustrate the afterlife of exposed data.</desc><defs></defs><style>.travel{stroke-dasharray:5 9;animation:travel 4s linear 1}.appear{animation:appear 1.8s ease-out both}.later{animation-delay:.7s}@keyframes travel{from{stroke-dashoffset:112}to{stroke-dashoffset:0}}@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.travel,.appear{animation:none}}</style><rect x="0" y="0" width="840" height="485" rx="20" fill="#f7f3ed" stroke="none" /><text x="36" y="41" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#846e77" text-anchor="start">01 / THE AFTERLIFE OF A BREACH</text><text x="36" y="90" font-family="Georgia,serif" font-size="34" font-weight="400" fill="#302736" text-anchor="start">The news moves on.</text><text x="36" y="128" font-family="Georgia,serif" font-size="34" font-weight="400" fill="#302736" text-anchor="start">The files keep travelling.</text><path d="M152 280 C245 245 210 190 322 231 S465 333 527 262 S632 187 713 231" fill="none" stroke="#ad82b9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="travel"/><g transform="rotate(-8 134 263)"><rect x="60" y="185" width="145" height="160" rx="4" fill="#e4dce8" stroke="#c8bace" /><rect x="71" y="175" width="145" height="160" rx="4" fill="#fffdf7" stroke="#d8cfc4" /><text x="87" y="204" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" fill="#8c7e86" text-anchor="start">DATABASE EXPORT</text><rect x="87" y="224" width="110" height="4" rx="2" fill="#dcd4df" stroke="none" /><rect x="87" y="238" width="88" height="4" rx="2" fill="#dcd4df" stroke="none" /><rect x="87" y="252" width="101" height="4" rx="2" fill="#dcd4df" stroke="none" /><rect x="87" y="266" width="74" height="4" rx="2" fill="#dcd4df" stroke="none" /><rect x="87" y="280" width="110" height="4" rx="2" fill="#dcd4df" stroke="none" /><rect x="87" y="294" width="91" height="4" rx="2" fill="#dcd4df" stroke="none" /><rect x="89" y="292" width="93" height="27" rx="13" fill="#efe5f4" stroke="none" /><text x="135.5" y="310" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#765189" text-anchor="middle">EXPOSED</text></g><text x="61" y="374" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="600" fill="#302736" text-anchor="start">01  Exposure</text><text x="61" y="398" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="400" fill="#81707b" text-anchor="start">A copy leaves the system.</text><g transform="rotate(4 340 245)"><path d="M267 185 H324 L341 204 H406 V316 H267Z" fill="#d1b5df" stroke="#a785b7"/><rect x="255" y="220" width="162" height="104" rx="7" fill="#ecdef1" stroke="#bc9dca" /><text x="273" y="249" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#785088" text-anchor="start">PRIVATE ARCHIVE</text><rect x="273" y="264" width="124" height="4" rx="2" fill="#c8b0d2" stroke="none" /><rect x="273" y="278" width="105" height="4" rx="2" fill="#c8b0d2" stroke="none" /><rect x="273" y="292" width="79" height="4" rx="2" fill="#c8b0d2" stroke="none" /></g><text x="261" y="374" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="600" fill="#302736" text-anchor="start">02  Trade</text><text x="261" y="398" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="400" fill="#81707b" text-anchor="start">Copies change hands.</text><rect x="463" y="222" width="148" height="20" rx="4" fill="#e8e0d4" stroke="#cbbdd0" /><text x="474" y="236" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" font-weight="400" fill="#796882" text-anchor="start">older records</text><rect x="463" y="244" width="138" height="20" rx="4" fill="#ede5f2" stroke="#cbbdd0" /><text x="474" y="258" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" font-weight="400" fill="#796882" text-anchor="start">new material</text><rect x="463" y="266" width="148" height="20" rx="4" fill="#d0bfd9" stroke="#cbbdd0" /><text x="474" y="280" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" font-weight="400" fill="#796882" text-anchor="start">repackaged</text><text x="457" y="374" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="600" fill="#302736" text-anchor="start">03  Combine</text><text x="457" y="398" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="400" fill="#81707b" text-anchor="start">Old meets new.</text><g transform="rotate(-10 718 260)"><rect x="662" y="211" width="109" height="101" rx="5" fill="#fffdf7" stroke="#cdbed2" /><rect x="676" y="231" width="78" height="4" rx="2" fill="#dcd4df" stroke="none" /><rect x="676" y="245" width="62" height="4" rx="2" fill="#dcd4df" stroke="none" /><rect x="676" y="259" width="72" height="4" rx="2" fill="#dcd4df" stroke="none" /><rect x="676" y="273" width="50" height="4" rx="2" fill="#dcd4df" stroke="none" /><text x="676" y="292" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="600" fill="#a16bb1" text-anchor="start">COPY</text></g><g transform="rotate(8 734 248)"><rect x="678" y="199" width="109" height="101" rx="5" fill="#fffdf7" stroke="#cdbed2" /><rect x="692" y="219" width="78" height="4" rx="2" fill="#dcd4df" stroke="none" /><rect x="692" y="233" width="62" height="4" rx="2" fill="#dcd4df" stroke="none" /><rect x="692" y="247" width="72" height="4" rx="2" fill="#dcd4df" stroke="none" /><rect x="692" y="261" width="50" height="4" rx="2" fill="#dcd4df" stroke="none" /><text x="692" y="280" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="600" fill="#a16bb1" text-anchor="start">COPY</text></g><g transform="rotate(0 725 273)"><rect x="669" y="224" width="109" height="101" rx="5" fill="#fffdf7" stroke="#cdbed2" /><rect x="683" y="244" width="78" height="4" rx="2" fill="#dcd4df" stroke="none" /><rect x="683" y="258" width="62" height="4" rx="2" fill="#dcd4df" stroke="none" /><rect x="683" y="272" width="72" height="4" rx="2" fill="#dcd4df" stroke="none" /><rect x="683" y="286" width="50" height="4" rx="2" fill="#dcd4df" stroke="none" /><text x="683" y="305" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="600" fill="#a16bb1" text-anchor="start">COPY</text></g><text x="651" y="374" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="600" fill="#302736" text-anchor="start">04  Resurface</text><text x="651" y="398" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="400" fill="#81707b" text-anchor="start">Another public release.</text><text x="36" y="454" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="400" fill="#81707b" text-anchor="start">An illustrative route through the ecosystem. Copies can circulate for years.</text></svg>