<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" fill="none" role="img" aria-label="A breach headline lasts a week. The stolen file keeps getting copied for years: one copy, then two, four, eight.">
  <rect width="720" height="300" rx="16" fill="#faf8fc"/>
  <defs>
    <g id="doc">
      <path d="M0 3a3 3 0 0 1 3-3h15l8 8v23a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3z" fill="#ffffff" stroke="#c9a8de" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M18 0v8h8" stroke="#c9a8de" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M6 16h13M6 22h9" stroke="#e4dcec" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>
  <!-- headline -->
  <rect x="56" y="78" width="170" height="104" rx="12" fill="#ffffff" stroke="#e4dcec"/>
  <circle cx="76" cy="100" r="4" fill="#e879b8"/>
  <text x="88" y="104" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1" fill="#e879b8">BREACH</text>
  <rect x="72" y="120" width="134" height="9" rx="4.5" fill="#17141f" fill-opacity="0.75"/>
  <rect x="72" y="136" width="100" height="9" rx="4.5" fill="#17141f" fill-opacity="0.75"/>
  <rect x="72" y="158" width="120" height="6" rx="3" fill="#e4dcec"/>
  <!-- copies -->
  <use href="#doc" x="286" y="113" />
  <use href="#doc" x="368" y="92" /> <use href="#doc" x="368" y="136" />
  <use href="#doc" x="446" y="92" /> <use href="#doc" x="478" y="92" /> <use href="#doc" x="446" y="136" /> <use href="#doc" x="478" y="136" />
  <use href="#doc" x="556" y="92" /> <use href="#doc" x="588" y="92" /> <use href="#doc" x="620" y="92" /> <use href="#doc" x="652" y="92" />
  <use href="#doc" x="556" y="136" /> <use href="#doc" x="588" y="136" /> <use href="#doc" x="620" y="136" /> <use href="#doc" x="652" y="136" />
  <g stroke="#c9a8de" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5"><path d="M236 130h38M322 130h34M404 130h30M514 130h30"/></g>
  <!-- axis -->
  <path d="M56 222H664" stroke="#e4dcec" stroke-width="1.5"/>
  <circle cx="141" cy="222" r="3.5" fill="#e879b8"/>
  <circle cx="664" cy="222" r="3.5" fill="#a855c8"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <text x="141" y="250" text-anchor="middle" font-size="13.5" font-weight="600" fill="#17141f">the news</text>
    <text x="141" y="269" text-anchor="middle" font-size="12" fill="#9a93a8">gone in a week</text>
    <text x="664" y="250" text-anchor="end" font-size="13.5" font-weight="600" fill="#17141f">the file</text>
    <text x="664" y="269" text-anchor="end" font-size="12" fill="#9a93a8">still copying, years later</text>
  </g>
</svg>
