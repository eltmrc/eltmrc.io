<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" fill="none" role="img" aria-label="Breaches and collections, circle area to scale: Yahoo 2013, 3 billion accounts. Equifax 2017, 147 million people. Collection #1 2019, 773 million emails. Naz.API 2024, 70.8 million emails. Synthient 2025, 1.96 billion emails.">
  <rect width="720" height="330" rx="16" fill="#faf8fc"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#6b6478"><circle cx="44" cy="38" r="5" fill="#e879b8" fill-opacity="0.25" stroke="#e879b8"/><text x="56" y="42">one company hacked</text><circle cx="200" cy="38" r="5" fill="#a855c8" fill-opacity="0.2" stroke="#a855c8"/><text x="212" y="42">leaks of leaks, repackaged</text></g>
  <path d="M36 200H684" stroke="#e4dcec" stroke-width="1.5"/>
  <circle cx="110" cy="130.0" r="70.0" fill="#e879b8" fill-opacity="0.22" stroke="#e879b8" stroke-width="1.5"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle"><text x="110" y="228" font-size="12" fill="#9a93a8">2013</text><text x="110" y="248" font-size="13.5" font-weight="600" fill="#17141f">Yahoo</text><text x="110" y="272" font-size="17" font-weight="700" fill="#e879b8">3B</text><text x="110" y="290" font-size="12" fill="#9a93a8">accounts</text></g>
  <circle cx="240" cy="184.5" r="15.5" fill="#e879b8" fill-opacity="0.22" stroke="#e879b8" stroke-width="1.5"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle"><text x="240" y="228" font-size="12" fill="#9a93a8">2017</text><text x="240" y="248" font-size="13.5" font-weight="600" fill="#17141f">Equifax</text><text x="240" y="272" font-size="17" font-weight="700" fill="#e879b8">147M</text><text x="240" y="290" font-size="12" fill="#9a93a8">people</text></g>
  <circle cx="345" cy="164.5" r="35.5" fill="#a855c8" fill-opacity="0.18" stroke="#a855c8" stroke-width="1.5"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle"><text x="345" y="228" font-size="12" fill="#9a93a8">2019</text><text x="345" y="248" font-size="13.5" font-weight="600" fill="#17141f">Collection #1</text><text x="345" y="272" font-size="17" font-weight="700" fill="#a855c8">773M</text><text x="345" y="290" font-size="12" fill="#9a93a8">emails</text></g>
  <circle cx="460" cy="189.2" r="10.8" fill="#a855c8" fill-opacity="0.18" stroke="#a855c8" stroke-width="1.5"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle"><text x="460" y="228" font-size="12" fill="#9a93a8">2024</text><text x="460" y="248" font-size="13.5" font-weight="600" fill="#17141f">Naz.API</text><text x="460" y="272" font-size="17" font-weight="700" fill="#a855c8">70.8M</text><text x="460" y="290" font-size="12" fill="#9a93a8">emails</text></g>
  <circle cx="590" cy="143.4" r="56.6" fill="#a855c8" fill-opacity="0.18" stroke="#a855c8" stroke-width="1.5"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle"><text x="590" y="228" font-size="12" fill="#9a93a8">2025</text><text x="590" y="248" font-size="13.5" font-weight="600" fill="#17141f">Synthient</text><text x="590" y="272" font-size="17" font-weight="700" fill="#a855c8">1.96B</text><text x="590" y="290" font-size="12" fill="#9a93a8">emails</text></g>
</svg>
