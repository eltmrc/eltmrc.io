<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img" aria-labelledby="title desc">
<title id="title">DIFFERENT YEARS. THE SAME EXPOSURE PROBLEM.</title><desc id="desc">Yahoo 2013: 3 billion accounts. Equifax 2017: 147 million people. Collection 1 2019: 773 million email addresses. Collections 2 to 5 followed. Naz.API 2024: 70.8 million email addresses. Synthient-indexed corpus 2025: 1.96 billion email addresses. Sources are linked in the accompanying article.</desc>
<style>text{font-family:ui-sans-serif,system-ui,sans-serif}.flow{animation:flow 4s linear 1}.reveal{animation:reveal 2s ease-out 1}@keyframes flow{from{stroke-dashoffset:104}to{stroke-dashoffset:0}}@keyframes reveal{from{opacity:.25}to{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.reveal{animation:none}}</style>
<rect width="720" height="600" rx="20" fill="#faf8fc"/>
<text x="32" y="40" font-size="15" fill="#785a8b" font-weight="600" text-anchor="start">DIFFERENT YEARS. THE SAME EXPOSURE PROBLEM.</text><path d="M52 88 V493" fill="none" stroke="#d6c5e0" stroke-width="2" /><circle cx="52" cy="94" r="5" fill="#a855c8"/><text x="76" y="100" font-size="16" fill="#785a8b" font-weight="600" text-anchor="start">2013</text><text x="143" y="100" font-size="17" fill="#292132" font-weight="600" text-anchor="start">Yahoo</text><text x="665" y="98" font-size="22" fill="#63387c" font-weight="600" text-anchor="end">3 billion</text><text x="665" y="121" font-size="14" fill="#74657f" font-weight="400" text-anchor="end">accounts affected</text><circle cx="52" cy="170" r="5" fill="#a855c8"/><text x="76" y="176" font-size="16" fill="#785a8b" font-weight="600" text-anchor="start">2017</text><text x="143" y="176" font-size="17" fill="#292132" font-weight="600" text-anchor="start">Equifax</text><text x="665" y="174" font-size="22" fill="#63387c" font-weight="600" text-anchor="end">147 million</text><text x="665" y="197" font-size="14" fill="#74657f" font-weight="400" text-anchor="end">people affected</text><circle cx="52" cy="246" r="5" fill="#a855c8"/><text x="76" y="252" font-size="16" fill="#785a8b" font-weight="600" text-anchor="start">2019</text><text x="143" y="252" font-size="17" fill="#292132" font-weight="600" text-anchor="start">Collection #1</text><text x="665" y="250" font-size="22" fill="#63387c" font-weight="600" text-anchor="end">773 million</text><text x="665" y="273" font-size="14" fill="#74657f" font-weight="400" text-anchor="end">unique email addresses</text><circle cx="52" cy="322" r="5" fill="#a855c8"/><text x="76" y="328" font-size="16" fill="#785a8b" font-weight="600" text-anchor="start">2019</text><text x="143" y="328" font-size="17" fill="#292132" font-weight="600" text-anchor="start">Collections #2–5</text><text x="665" y="326" font-size="22" fill="#63387c" font-weight="600" text-anchor="end">More collections</text><text x="665" y="349" font-size="14" fill="#74657f" font-weight="400" text-anchor="end">rapidly followed #1</text><circle cx="52" cy="398" r="5" fill="#a855c8"/><text x="76" y="404" font-size="16" fill="#785a8b" font-weight="600" text-anchor="start">2024</text><text x="143" y="404" font-size="17" fill="#292132" font-weight="600" text-anchor="start">Naz.API</text><text x="665" y="402" font-size="22" fill="#63387c" font-weight="600" text-anchor="end">70.8 million</text><text x="665" y="425" font-size="14" fill="#74657f" font-weight="400" text-anchor="end">unique email addresses</text><circle cx="52" cy="474" r="5" fill="#a855c8"/><text x="76" y="480" font-size="16" fill="#785a8b" font-weight="600" text-anchor="start">2025</text><text x="143" y="480" font-size="17" fill="#292132" font-weight="600" text-anchor="start">Synthient-indexed corpus</text><text x="665" y="478" font-size="22" fill="#63387c" font-weight="600" text-anchor="end">1.96 billion</text><text x="665" y="501" font-size="14" fill="#74657f" font-weight="400" text-anchor="end">unique email addresses</text><text x="32" y="568" font-size="16" fill="#292132" font-weight="400" text-anchor="start">Different units. Overlapping records. These numbers cannot be added.</text></svg>