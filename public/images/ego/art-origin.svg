<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" fill="none" role="img" aria-label="Same abstract painting. A 5 year old made it, or a model made it. Neither is the origin.">
  <rect width="720" height="300" rx="16" fill="#faf8fc"/>
  <defs>
    <g id="paint">
      <rect width="160" height="160" rx="4" fill="#fffdf8"/>
      <path d="M18 40q40-30 70 10t60-10" stroke="#e86a6a" stroke-width="10" stroke-linecap="round"/>
      <circle cx="108" cy="104" r="28" fill="#e8c27a" fill-opacity="0.85"/>
      <rect x="22" y="88" width="56" height="50" rx="3" fill="#7aa7e8" fill-opacity="0.85"/>
      <path d="M30 150 140 70" stroke="#17141f" stroke-width="4" stroke-linecap="round"/>
    </g>
  </defs>
  <g transform="translate(120 40)"><rect x="-12" y="-12" width="184" height="184" rx="8" fill="#c9a8de"/><use href="#paint"/></g>
  <g transform="translate(440 40)"><rect x="-12" y="-12" width="184" height="184" rx="8" fill="#c9a8de"/><use href="#paint"/></g>
  <text x="200" y="238" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#17141f">made by a 5 year old</text>
  <text x="200" y="258" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#9a93a8">cute. not art.</text>
  <text x="520" y="238" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#17141f">made by a model</text>
  <text x="520" y="258" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#9a93a8">same thing.</text>
  <text x="360" y="128" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" fill="#a855c8">=</text>
</svg>
